async function connect(config,initialMonth,{keepPage=false}={}){

function nativeForm(title,fields,onSave){const d=$('#dialog');d.oninput=null;d.innerHTML=`<h2>${esc(title)}</h2><form id="nativeForm"><div class="formGrid">${fields.map(f=>`<label class="${fields.length<3?'full':'wide'}">${esc(f.label)}${f.options?`<select name="${f.key}" ${f.required?'required':''}><option value="">선택</option>${f.options.map(o=>`<option ${o===f.value?'selected':''}>${esc(o)}</option>`).join('')}</select>`:`<input name="${f.key}" type="${f.type||'text'}" value="${esc(f.value??'')}" ${f.required?'required':''} ${f.type==='number'?`${f.allowNegative?'':'min="0"'} step="any"`:''}>`}</label>`).join('')}</div><div class="actions" style="justify-content:flex-end;margin-top:24px"><button type="button" id="closeNative">취소</button><button class="primary" type="submit">저장</button></div></form>`;$('#closeNative').onclick=()=>d.close();$('#nativeForm').onsubmit=async e=>{e.preventDefault();if(busy)return;busy=true;const values={};try{for(const f of fields){const raw=e.target.elements[f.key].value.trim();values[f.key]=f.type==='number'?C.num(raw):raw;if(f.required&&(raw===''||values[f.key]==null))throw Error(f.label+'을 입력해 주세요.');if(f.type==='number'&&!f.allowNegative&&values[f.key]!=null&&values[f.key]<0)throw Error('0 이상의 숫자를 입력해 주세요.')}await onSave(values);d.close();render();toast('기록을 저장했습니다.')}catch(err){toast(err.message)}finally{busy=false}};d.showModal()}

function reportView(){const r=O.report(state,month),x=r.totals,handoffPending=!!m().carryOut&&state.months[m().carryOut.targetMonth]?.acceptedCarryId!==m().carryOut.id,pending=handoffPending||workspace?.envelope.queue.some(q=>q.path==='months/'+month+'.json'||q.path==='months/'+O.nextMonth(month)+'.json'||q.path==='meta/catalog.json');return head('월마감·보고서','생산·교체·실사·석고 사용량을 확인하고 다음달로 이어갑니다.',btn('newMonth','다음달 준비')+btn('closeMonth','월마감 검토','',m().closed)+btn('reportPrint','보고서 인쇄'))+`${m().closed?`<div class="notice blue">${m().closeSnapshot?'마감 수치가 보관되어 있습니다.':'엑셀에서 마감된 보관월입니다.'} ${pending?'마감 보관됨 · 다음달 반영 확인 대기. ‘다음달 준비’에서 전달자료를 복구하고 연결·백업에서 전송 상태를 확인해 주세요.':workspace?'GitHub 대기 전송 없음.':'기기자료 · GitHub 반영 전.'}</div>`:''}<div class="stats">${metric('생산 석고',x.kg,'kg','생산일보 단위 × 생산 조')}${metric('교체',x.replacement,'조','재고 차감 수량')}${metric('실사용 석고',x.actual,'kg','미입력과 0 구분')}${metric('하루 평균 실사용',x.actualAverage,'kg','실사용이 0이 아닌 날짜')}</div><section class="card"><div class="toolbar"><h2>품목별 월 집계</h2>${btn('csvReport','집계 내려받기')}</div>${reportTable(r)}<p class="footerNote">실사량은 다음달 이월 중 실사 반영 근거가 있는 수량입니다. 마감 후 기준 kg를 변경해도 이 보고서는 그대로 유지됩니다.</p></section><section class="card"><div class="toolbar"><h2>일자별 석고 사용량</h2>${btn('plaster','실사용 입력','',m().closed)}</div>${table(['날짜','일보 계산 kg','실사용 kg','차이 kg'],r.days.map(d=>tr([td(d.date),td(fmt(d.used),'num'),td(fmt(d.actual),'num'),td(fmt(d.difference),'num')])))}<p class="footerNote">계산 사용량 평균 ${fmt(x.usedAverage)} kg · 실사용 평균 ${fmt(x.actualAverage)} kg. 각 열의 비0 날짜를 따로 셉니다.</p></section>${workerTable()}${annualTable()}<section class="card"><div class="toolbar"><h2>변경 이력</h2>${btn('history','전체 이력')}</div>${table(['시각','처리','사유'],(m().history||[]).slice(-8).reverse().map(h=>tr([td(new Date(h.at).toLocaleString('ko-KR')),td(esc(h.type)),td(esc(h.reason))])))}</section>`}

  commit:async draft=>{

   for(const row of merged){if(secondarySame(row,latestById.get(row.id)))continue;validate(row);const old=next.months[key].plaster.find(r=>r.date===row.date),actual=secondaryNumber(row.actual,'actual','실사용 kg');if(!old&&actual==null)continue;O.upsert(next,key,'plaster',{...(old||{}),id:old?.id||C.id(),date:row.date,actual},'월별 실사용량 표 입력')}

function secondarySelectedAudit(){

   const latest=secondaryAuditRows(latestAudit),merged=sheetApply(draft,latest,{validateRow:validate}),next=C.clone(state),am=next.months[key].auditSessions.find(x=>x.id===a.id),latestById=new Map(latest.map(r=>[r.id,r])),before=[],after=[];
   const names=new Set();for(const row of merged){if(names.has(row.product))secondaryError('product','같은 품명이 이미 실사표에 있습니다.');names.add(row.product)}

function secondaryMasterAliases(value,name=''){
 const values=value==null?[]:Array.isArray(value)?value:typeof value==='string'?value.split(/\r\n|\r|\n/):null;
 if(!values||values.some(v=>typeof v!=='string'))secondaryError('aliases','현장일보 다른 이름은 한 줄에 하나씩 문자로 입력해 주세요.');
 return[...new Set(values.map(v=>v.trim()).filter(v=>v&&v!==secondaryText(name)))];
}
function secondaryMasterAliasErrors(rows){
 const errors=[],names=new Map(rows.filter(r=>secondaryText(r.name)).map(r=>[secondaryText(r.name),r])),aliases=new Map();
 for(const row of rows)for(const alias of secondaryMasterAliases(row.aliases,row.name)){
  const owner=names.get(alias)||aliases.get(alias);if(owner&&owner.id!==row.id){errors.push({id:row.id,field:'aliases',message:'다른 이름 “'+alias+'”이 '+owner.name+' 품명 또는 다른 이름과 중복됩니다.'});if(!names.has(alias))errors.push({id:owner.id,field:'aliases',message:'다른 이름 “'+alias+'”이 '+row.name+'의 다른 이름과 중복됩니다.'})}else aliases.set(alias,row);
 }

function ilboEnsureScope(){

async function ilboCheck(manual=false){
 ilboEnsureScope();const client=workspace;if(!client||client.pendingMigration||client.closed||ilboRefreshRun||document.hidden||booting||!state)return;
 const run={client,scope:client.key};ilboInitialClient=client;ilboRefreshRun=run;ilboRenderStatus();const current=()=>workspace===client&&ilboStatusClient===client&&client.key===run.scope&&ilboStatusScope===run.scope&&ilboRefreshRun===run;

  const result=await client.client.get('meta/ilbo-sync.json',true);if(!current())return;
  const report=result.data?.records?result.data.records.length===1?result.data.records[0]:false:result.data;
  if(report&&(report.kind!=='ilbo-sync-report'||report.schema!==1||!Array.isArray(report.issues)||report.issues.some(i=>!i||typeof i!=='object')))throw Error('invalid-sync-report');
  if(report===false)throw Error('invalid-sync-report');
  ilboStatus=report||null;ilboStatusError=report?'':'아직 자동 연동 결과가 없습니다. 첫 연동이 끝난 뒤 다시 확인해 주세요.';
  const revision=result.sha||'';
  if(manual||revision&&revision!==ilboAppliedRevision){
   if(ilboCanRefresh(client)){
    const next=await client.open({canApply:()=>ilboCanRefresh(client)});if(!current())return;
    if(next&&ilboCanRefresh(client)){state=next;ilboAppliedRevision=revision;ilboRefreshPending=false;render();if(manual)toast('GitHub 최신자료를 확인했습니다.')}
    else ilboRefreshPending=true;
   }else{ilboRefreshPending=true;if(manual)toast('편집 내용을 먼저 저장해 주세요. 미저장 내용은 그대로 보관되어 있습니다.')}
  }
 }catch(e){if(current()){ilboStatusError=e.message==='invalid-sync-report'?'자동 연동 결과의 형식을 확인하지 못했습니다. 관리 저장소의 연동 실행 결과를 확인해 주세요.':'GitHub 연동 상태를 읽지 못했습니다. 연결·백업에서 접근 권한과 연결 상태를 확인해 주세요.';if(manual)toast(ilboStatusError)}}finally{if(current()){ilboRefreshRun=null;ilboRenderStatus()}}
}
function bindIlboIntegrationUI(){

}
