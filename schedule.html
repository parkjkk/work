function connectionView(first=false){let config={};try{config=JSON.parse(localStorage.getItem('schedule.v1.connection')||'{}')}catch(e){}return `<div class="top"><div><h1>${first?'조형 생산관리 시작하기':'연결·백업'}</h1><p class="subtle">웹에서 입력하고 GitHub에 저장합니다. 다시 열면 저장된 자료를 이어서 사용합니다.</p></div></div><section class="card"><h2>데이터 저장소 연결</h2><div class="formGrid"><label>GitHub 계정<input id="owner" value="${esc(config.owner||'parkjkk')}" placeholder="계정 이름" autocomplete="off"></label><label>데이터 저장소<input id="repo" value="${esc(config.repo||'schedule-data')}" autocomplete="off"></label><label>브랜치<input id="branch" value="${esc(config.branch||'main')}"></label><label>시작할 월<input id="firstMonth" type="month" value="${today().slice(0,7)}"></label><label class="full">접근 토큰<input id="token" type="password" autocomplete="off" placeholder="이 데이터 저장소의 Contents 읽기·쓰기 권한"></label><label class="full" style="display:block;font-weight:400"><input id="rememberConnection" type="checkbox"> 내 기기에서 연결 유지</label></div><p class="footerNote">업무 데이터용 비공개 저장소를 연결합니다. 새 저장소는 README를 포함해 생성해야 합니다. 연결 유지 선택 시 토큰은 이 브라우저에 저장되며 HTML·GitHub 자료·공유주소에는 포함되지 않습니다.</p><div class="actions"><button class="primary" data-action="connect">연결하고 자료 열기</button><span id="connectionResult" class="subtle"></span></div></section>${first?'<section class="card"><h2>HTML 먼저 준비하기</h2><p>저장소 연결 전 기준정보와 입력 화면을 준비할 수 있습니다. 자료는 이 기기에 보관하며 연결 후 최초 이전으로 저장합니다.</p><button data-action="startDraft">연결 전 입력 시작</button></section>':`<section class="card"><h2>저장 상태</h2><p>${esc(connectionStatus)}</p><div class="actions"><button data-action="retry">대기 자료 다시 전송</button><button data-action="refresh">GitHub 최신자료 읽기</button><button data-action="remoteBackup">GitHub 전체자료 백업</button></div><div id="conflictList"></div></section><section class="card"><h2>최초 이전 · 복구</h2><p class="subtle">엑셀은 기존자료를 처음 옮길 때만 사용합니다. 평소 입력과 수정은 웹 화면에서 진행합니다.</p><div class="actions"><button data-action="import">최초 엑셀자료 이전</button><button data-action="migrate">이 기기 이전자료를 GitHub에 저장</button><button data-action="export">기기 보관자료 내려받기</button></div><p class="source">${esc(state?.source||'')}</p></section>`}`}

function bindActions(){document.querySelectorAll('[data-action]').forEach(b=>b.onclick=async()=>{const a=b.dataset.action;if(busy){toast('저장이 끝난 뒤 다시 눌러 주세요.');return}if(tabs.some(([k])=>k===a)){if(a==='report'&&b.dataset.workspacePanel==='plaster'&&typeof workspaceScreen!=='undefined')workspaceScreen.panels.set('report','plaster');page=a;render();return}try{if(await enhancedAction(a,b))return;if(['connect','retry','refresh','remoteBackup','migrate','newProduct','newWorker','newIssue','newMonth','setOpening'].includes(a)){await nativeAction(a);return}if(a==='import')$('#file').click();if(a==='newEntry')await entry();if(a==='export')download(JSON.stringify(workspace?{...state,_pendingOperations:workspace.envelope.queue}:state,null,2),'조형_웹검증자료_'+today()+'.json','application/json');if(a==='print')window.print();if(a==='csvDaily')csv(['날짜','작업자','품명','주입횟수','생산kg','LOT','품목 메모'],m().rows.map(r=>[r.date,r.worker,r.product,r.pours,C.daily(r).plaster,r.lot,ScheduleBatch.memoValue(state,null,r.product)]),'생산일보');if(a==='csvStock')csv(['품명','이월','생산','교체차감','재계산현재고','원본현재고'],C.inventory(state,month).map(r=>[r.product,r.opening,r.production,r.deduction,r.current,r.original]),'재고대조');if(a==='dryCalc')dryDialog();if(a==='checkConnection'){const config={owner:$('#owner').value.trim(),repo:$('#repo').value.trim(),branch:$('#branch').value.trim(),token:$('#token').value.trim()};if(!config.token)throw Error('접근 토큰을 입력해 주세요.');b.disabled=true;try{const client=new S.GithubStore(config),r=await client.check();$('#connectionResult').textContent=r.name+' · 비공개 확인';$('#token').value='';client.invalidate()}finally{b.disabled=false}}}catch(e){toast(e.message)}})}
function bindPage(){const search=$('#search');if(search)search.oninput=e=>{const pos=e.target.selectionStart;filter=e.target.value;render();$('#search').focus();$('#search').setSelectionRange(pos,pos)};document.querySelectorAll('[data-edit]').forEach(b=>b.onclick=async()=>{try{await entry(m().rows.find(r=>r.id===b.dataset.edit))}catch(e){toast(e.message)}});if(page==='settings')showConflicts();if(page==='source'){$('#sheetSelect').onchange=showArchive;showArchive()}}
function showArchive(){if(!state.archive.length){$('#archiveView').innerHTML='<p class="empty">최초 이전한 원본은 GitHub 전체자료 백업에 포함됩니다. 현재 화면은 웹 원장을 사용합니다.</p>';return}const s=state.archive.find(s=>s.name===$('#sheetSelect').value),maxR=Math.min(300,Math.max(...Object.keys(s.cells).map(a=>+a.match(/\d+/)[0]))),maxC=Math.min(44,Math.max(...Object.keys(s.cells).map(a=>C.ci(a.match(/[A-Z]+/)[0]))));const rows=[];for(let r=1;r<=maxR;r++){if(!Object.keys(s.cells).some(a=>+a.match(/\d+/)[0]===r))continue;rows.push(tr([td(r,'source'),...Array.from({length:maxC},(_,i)=>{const cell=s.cells[C.col(i+1)+r],v=cell?.v;return td(`<span title="${esc(C.col(i+1)+r)}">${esc(v==null?'':typeof v==='number'?fmt(v,4):String(v).replace(/(?:암호|비밀번호|password)\s*[:=]?\s*\d+/gi,'보호정보 생략'))}</span>`)})]))}$('#archiveView').innerHTML=`<div class="archivePane">${table(['행',...Array.from({length:maxC},(_,i)=>C.col(i+1))],rows)}</div><p class="footerNote">앞 44열·300행 조회. 내려받는 전체 기기자료에는 모든 시트의 읽은 셀 값이 포함됩니다.</p>`}
function csv(headers,rows,name){const safe=x=>{let s=String(x??'');if(/^[=+@-]/.test(s)&&isNaN(Number(s)))s="'"+s;return'"'+s.replace(/"/g,'""')+'"'};download('\ufeff'+[headers,...rows].map(r=>r.map(safe).join(',')).join('\r\n'),name+'_'+month+'.csv','text/csv;charset=utf-8')}
function download(text,name,type){const a=document.createElement('a');a.href=URL.createObjectURL(new Blob([text],{type}));a.download=name;a.click();setTimeout(()=>URL.revokeObjectURL(a.href),5000)}
async function entry(existing){if(localReadError)throw Error('기기 보관자료를 읽지 못해 입력을 열 수 없습니다. 저장 허용 설정을 확인한 뒤 새로고침해 주세요.');draftProducts=existing?[C.clone(existing)]:[{product:'',plan:null,pours:null,waterRatio:null,defectCount:null,defectUnit:null,defectPart:''}];const draftKey='draft:'+(workspace?.key||'migration-preview')+':'+month,saved=existing?null:await S.localGet(draftKey),last=existing?null:await S.localGet(draftKey+':last');if(saved?.products?.length)draftProducts=saved.products;const d=$('#dialog');d.innerHTML=`<h2>${existing?'생산기록 수정':'여러 품목 생산기록 입력'}</h2><div class="notice blue">날짜·작업자·근무시간·LOT를 한 번 입력하고 여러 품목을 함께 저장합니다. 네트워크가 끊기면 보관 후 다시 전송합니다.</div><div class="entryHead formGrid"><label>작업일<input type="date" id="entryDate" value="${esc(existing?.date||saved?.date||(today().startsWith(month)?today():month+'-01'))}"></label><label>작업자<select id="entryWorker"><option value="">선택</option>${state.workers.map(w=>`<option ${w===(existing?.worker||saved?.worker||last?.worker)?'selected':''}>${esc(w)}</option>`).join('')}</select></label><label>근무시간<input id="entryHours" type="number" step="0.25" min="0" value="${existing?.hours??saved?.hours??''}" placeholder="실제 근무시간"></label><label>석고 LOT<input id="entryLot" value="${esc(existing?.lot||saved?.lot||last?.lot||'')}"></label></div><div id="entryProducts"></div><div class="actions"><button id="addProduct" ${existing?'hidden':''}>+ 품목 추가</button></div><div class="actions" style="justify-content:flex-end;margin-top:24px"><button id="cancelEntry">취소</button><button id="saveEntry" class="primary">생산기록 저장</button></div>`;drawProducts();$('#cancelEntry').onclick=()=>d.close();$('#addProduct').onclick=()=>{readProducts();draftProducts.push({product:'',plan:null,pours:null});drawProducts()};$('#saveEntry').onclick=async()=>{if(busy)return;busy=true;try{readProducts();const next=C.clone(state),date=$('#entryDate').value,worker=$('#entryWorker').value,hours=C.num($('#entryHours').value),lot=$('#entryLot').value.trim(),batchId=C.id();draftProducts.forEach((r,i)=>{const p=state.products.find(p=>p.name===r.product);if(!p)throw Error('기준정보에 있는 품명을 선택해 주세요.');if(r.jobId){const j=P.jobs(state,month).find(j=>j.id===r.jobId);if(!j||j.worker!==worker||j.product!==r.product)throw Error('선택한 연결 작업의 작업자·품명이 입력과 다릅니다.');}C.updateDaily(next,month,{...r,date,worker,hours:i===0?hours:null,lot,plaster:existing&&existing.product===r.product?existing.plaster:p.kg,cases:existing&&existing.product===r.product?existing.cases:p.cases,explicit:existing?.explicit||{day:i===0,worker:i===0,hours:i===0&&hours!=null,pours:r.pours!=null,lot:i===0&&!!lot},batchId:existing?.batchId||batchId,source:r.source||'웹 입력'})});await persist(next,[month]);if(!existing){await S.localSet(draftKey,null);await S.localSet(draftKey+':last',{worker,lot})}d.close();render();toast('생산기록을 저장했습니다. 상단에서 GitHub 전송 상태를 확인할 수 있습니다.')}catch(e){toast(e.message)}finally{busy=false}};if(!existing)d.oninput=()=>{readProducts();S.localSet(draftKey,{date:$('#entryDate').value,worker:$('#entryWorker').value,hours:C.num($('#entryHours').value),lot:$('#entryLot').value,products:C.clone(draftProducts)}).catch(()=>toast('입력 초안 저장 공간을 확인해 주세요.'))};else d.oninput=null;d.showModal()}
function drawProducts(){$('#entryProducts').innerHTML=draftProducts.map((r,i)=>`<div class="productEntry" data-product-index="${i}"><header><b>품목 ${i+1}</b>${draftProducts.length>1?`<button class="removeProduct" data-i="${i}">삭제</button>`:''}</header><div class="formGrid"><label class="wide">품명<select class="productName"><option value="">품명 선택</option>${[...state.products].sort((a,b)=>globalThis.ProductOrder?.compareProducts(a,b)||0).map(p=>`<option value="${esc(p.name)}" ${p.name===r.product?'selected':''}>${esc(p.name)} · ${fmt(p.kg)}kg</option>`).join('')}</select></label><label class="wide">연결 작업<select class="jobRef"><option value="">배치 자동 연결</option>${P.jobs(state,month).filter(j=>!j.complete||j.id===r.jobId).map(j=>`<option value="${esc(j.id)}" ${j.id===r.jobId?'selected':''}>${esc(j.worker)} · ${esc(j.product)} · ${esc(j.start)}</option>`).join('')}</select></label><label>주입횟수 / 생산 조<input class="pours" type="number" min="0" step="0.5" value="${r.pours??''}"></label><label>작업 구분<select class="workMode"><option value="continue" ${r.plan==null?'selected':''}>계속 생산</option><option value="start" ${r.plan>0?'selected':''}>생산 시작</option><option value="end" ${r.plan===0?'selected':''}>종료·중단</option></select></label><label>시작 계획수량<input class="plan" type="number" min="1" step="0.5" value="${r.plan>0?r.plan:''}" ${r.plan>0?'':'disabled'}></label><label>혼수율 %<input class="ratio" type="number" step="0.1" min="0" value="${r.waterRatio??''}" placeholder="실제 입력값"></label><label>불량 개수<input class="defectCount" ${Object.hasOwn(r,'fieldDefQty')?'disabled title="현장일보에서 수정하는 불량 개수입니다."':''} type="number" min="0" step="1" value="${r.defectCount??''}"></label><label>불량 1개 석고 kg<input class="defectUnit" ${Object.hasOwn(r,'fieldScrapKg')?'disabled title="현장일보의 총불량 kg을 사용합니다. 현장일보에서 수정해 주세요."':''} type="number" min="0" step="0.1" value="${r.defectUnit??''}"></label><label class="full">불량 부위 / 비고<input class="defectPart" value="${esc(r.defectPart)}"></label></div><div class="output" async function connect(config,initialMonth,{keepPage=false}={}){
 if(localReadError)throw Error('기기 보관자료를 먼저 복원한 뒤 연결해 주세요. 저장 허용 설정을 확인하고 새로고침해 주세요.');
 const previous=workspace,beforeState=state,prepared=previous&&!previous.pendingMigration?null:state,beforeMonth=month;
 const next=new ScheduleNative.Workspace(config,message=>{if(workspace===next)setStatus(next.pendingMigration?'기기자료 준비됨 · 최초 이전 저장 필요':message)},updated=>{if(workspace===next&&!next.pendingMigration){state=updated;if(!$('#dialog').open)render()}});

 workspace=next;state=null;setStatus('GitHub 자료 읽는 중…');render();let cached=null;
 try{
  cached=await next.cache();if(workspace!==next)return;
  if(cached&&Object.keys(cached.months||{}).length&&![...sheetRegistry.values()].some(g=>g.scope===next.key)){const known=new Set(sheetRegistry.values());state=cached;connectionPreview=next;setStatus('기기 보관자료 · 최신자료 확인 중 · 조회 전용');render();for(const g of sheetRegistry.values())if(!known.has(g))next.previewEditors.add(g)}
  const loaded=await next.open({includeSyncStatus:true});if(workspace!==next)return;
  if(loaded){state=loaded;await next.flush()}else state=await next.initialize(initialMonth||today().slice(0,7));
  if(hasBusinessData(prepared)&&!hasBusinessData(state)){state=prepared;next.pendingMigration=true;setStatus('기기자료 준비됨 · 연결·백업에서 최초 이전 저장')}
  previous?.close();if(!state.months[month])month='';if(!keepPage)page=next.pendingMigration?'settings':'daily';
 }catch(e){
  if(workspace!==next)return;
  if(cached){previous?.close();state=cached;setStatus('기기 보관자료 · 연결 재시도 필요')}
  else{next.close();workspace=previous;state=beforeState;month=beforeMonth;ensureLocalState();setStatus('연결 실패 · 기존자료 유지')}
  throw e;
 }finally{if(connectionOpening===next){for(const g of next.previewEditors)if(!g.loaded&&!g.dirty&&!g.saving&&sheetRegistry.get(g.key)===g)sheetRegistry.delete(g.key);next.previewEditors.clear();connectionOpening=null;connectionPreview=null;busy=connectionBusyBefore;if(!booting)render()}}
}
async function restoreConnection(){
 try{
  try{const saved=await S.localGet('migration-preview');if(saved)state=saved;setStatus(saved?'기기에 보관 · GitHub 반영 전':'GitHub 미연결 · 화면 사용 가능')}
  catch(e){localReadError=e.message||'기기 저장소 접근 오류';setStatus('기기자료 읽기 실패 · 입력 저장 보류');toast(localReadError);return}
  let config,token;
  try{config=JSON.parse(localStorage.getItem('schedule.v1.connection')||'null');token=sessionStorage.getItem('schedule.v1.token')||localStorage.getItem('schedule.v1.token')}
  catch(e){toast('저장된 연결 설정을 읽지 못했습니다. 연결·백업에서 다시 입력할 수 있습니다.')}
  if(config&&token){try{await connect({...config,token},undefined,{keepPage:true})}catch(e){toast(e.message)}}
 }finally{ensureLocalState();booting=false;render()}
}

// One-time, explicitly password-approved handoff from this manager device to
// the fixed sharing administrator. No token is added to markup or a URL.
const shareSetupOrigin='https://parkjkk-production-view.pjk3742.chatgpt.site';
function shareSetupParse(hash){
 const params=new URLSearchParams(String(hash||'').replace(/^#/,''));if(!params.has('shareSetup'))return null;
 if(params.has('view')||params.getAll('shareSetup').length!==1)throw Error('공유 설정 링크를 다시 열어 주세요.');
 const encoded=params.get('shareSetup');if(!encoded||encoded.length>2048||!/^[A-Za-z0-9_-]+$/.test(encoded))throw Error('공유 설정 링크를 다시 열어 주세요.');
 let config;try{config=JSON.parse(new TextDecoder('utf-8',{fatal:true}).decode(Uint8Array.from(atob(encoded.replace(/-/g,'+').replace(/_/g,'/')+'='.repeat((4-encoded.length%4)%4)),c=>c.charCodeAt(0))))}catch{throw Error('공유 설정 링크를 다시 열어 주세요.')}
 if(!config||typeof config!=='object'||Array.isArray(config)||Object.keys(config).some(k=>!['server','nonce'].includes(k))||config.server!==shareSetupOrigin||typeof config.nonce!=='string'||!/^[0-9a-f]{8}-[0-9a-f]{4}-4[0-9a-f]{3}-[89ab][0-9a-f]{3}-[0-9a-f]{12}$/i.test(config.nonce))throw Error('허용된 공유 설정 링크가 아닙니다.');
 return{server:config.server,nonce:config.nonce};
}
const shareSetupState={running:false,finished:false,version:0};
const shareAdminLaunchState={pending:null};
function shareAdminLaunch(){
 const allowed=()=>page==='settings'&&managementConnectionGate.unlocked&&!(typeof shareViewSession!=='undefined'&&shareViewSession.active);
 if(!allowed()){toast('연결 설정의 비밀번호를 먼저 확인해 주세요.');return false}
 if(shareAdminLaunchState.pending){try{shareAdminLaunchState.pending.window?.focus()}catch{}return false}
 const readSaved=()=>{
  const config=JSON.parse(localStorage.getItem('schedule.v1.connection')||'null'),valid=c=>c?.owner==='parkjkk'&&c.repo==='schedule-data'&&(c.branch||'main')==='main';
  if(!valid(config)||workspace?.config&&!valid(workspace.config))throw Error('repository');
  const token=sessionStorage.getItem('schedule.v1.token')||localStorage.getItem('schedule.v1.token');
  if(typeof token!=='string'||!token.trim())throw Error('missing');return token;
 };
 let token;try{token=readSaved()}catch{toast('이 기기의 관리 저장소 연결이 필요합니다. GitHub 연결 설정을 먼저 저장한 뒤 다시 눌러 주세요.');return false}
 let nonce;try{nonce=crypto.randomUUID()}catch{token=null;toast('새 창 연결을 준비하지 못했습니다. 최신 브라우저에서 다시 열어 주세요.');return false}
 let opened=null,timeout=null,watch=null,done=false;
 const pending={window:null,cancel:()=>finish()};
 const finish=(message='')=>{
  if(done)return;done=true;token=null;
  if(timeout!==null)clearTimeout(timeout);if(watch!==null)clearInterval(watch);
  window.removeEventListener('message',ready);window.removeEventListener('pagehide',leave);window.removeEventListener('hashchange',leave);
  if(shareAdminLaunchState.pending===pending)shareAdminLaunchState.pending=null;
  if(message)toast(message);
 };
 const current=()=>allowed()&&shareAdminLaunchState.pending===pending&&opened&&!opened.closed;
 const leave=()=>finish();
 const ready=event=>{
  if(event.origin!==shareSetupOrigin||event.source!==opened||event.data?.type!=='production-admin-ready'||event.data?.nonce!==nonce)return;
  if(!current()){finish();return}
  try{
   if(readSaved()!==token){finish('관리 연결이 바뀌었습니다. 조회 링크 관리를 다시 열어 주세요.');return}
   // Only this exact opened window receives the one-time approved credential.
   opened.postMessage({type:'production-admin-launch',nonce,token},shareSetupOrigin);
   finish('공유 관리 화면에 연결을 전달했습니다. 새 창에서 결과를 확인해 주세요.');
  }catch{finish('공유 관리 화면에 연결을 전달하지 못했습니다. 연결 설정을 확인하고 다시 시도해 주세요.')}
 };
 shareAdminLaunchState.pending=pending;
 window.addEventListener('message',ready);window.addEventListener('pagehide',leave);window.addEventListener('hashchange',leave);
 try{
  // The button is inside settings that are already unlocked, so open remains
  // in the original user activation instead of following an awaited prompt.
  opened=window.open(shareSetupOrigin+'/#launch='+nonce,'_blank');pending.window=opened;
  if(!opened){finish('팝업이 차단되었습니다. 이 사이트의 팝업을 허용한 뒤 조회 링크 관리를 다시 눌러 주세요.');return false}
  timeout=setTimeout(()=>finish('공유 관리 화면의 응답을 기다리다 종료했습니다. 새 창을 확인한 뒤 다시 눌러 주세요.'),45000);
  watch=setInterval(()=>{if(!current())finish()},500);
  return true;
 }catch{finish('공유 관리 창을 열지 못했습니다. 브라우저의 팝업 설정을 확인해 주세요.');return false}
}
async function shareSetupStart(){
 if(shareSetupState.running||shareSetupState.finished||typeof shareViewSession!=='undefined'&&shareViewSession.active)return;
 let request;try{request=shareSetupParse(location.hash)}catch{toast('공유 설정 링크를 확인하지 못했습니다. 공유 관리 화면에서 다시 열어 주세요.');return}if(!request)return;
 const opener=window.opener,hash=location.hash,version=++shareSetupState.version;
 if(!opener||opener.closed){toast('공유 관리 화면에서 연결 가져오기를 다시 눌러 주세요.');return}
 shareSetupState.running=true;
 try{
  // Existing render wrappers relock settings on navigation. Use the settings
  // page in this separate window so background renders do not cancel the gate.
  page='settings';render();managementConnectionGate.lock();
  toast('비밀번호 확인 후 이 기기의 관리 저장소 연결을 공유 관리 화면에 전달합니다.');
  const approved=await managementConnectionGate.request();
  if(!approved||version!==shareSetupState.version||hash!==location.hash||window.opener!==opener||opener.closed||page!=='settings')return;
  let saved,token;try{saved=JSON.parse(localStorage.getItem('schedule.v1.connection')||'null');token=sessionStorage.getItem('schedule.v1.token')||localStorage.getItem('schedule.v1.token')}catch{toast('이 기기의 저장된 연결을 읽지 못했습니다. 연결 설정을 먼저 확인해 주세요.');return}
  const allowed=config=>config?.owner==='parkjkk'&&config.repo==='schedule-data'&&(config.branch||'main')==='main';
  if(!allowed(saved)||workspace?.config&&!allowed(workspace.config)){toast('관리용 schedule-data 저장소에 연결된 기기에서 다시 진행해 주세요.');return}
  if(typeof token!=='string'||!token.trim()){toast('이 기기에 저장된 관리 연결이 없습니다. 연결 설정을 먼저 완료해 주세요.');return}
  // targetOrigin prevents delivery if the opener navigated to another site.
  opener.postMessage({type:'schedule-share-connection',nonce:request.nonce,token},request.server);
  token=null;shareSetupState.finished=true;
  try{history.replaceState(null,'',location.pathname+location.search)}catch{}
  toast('연결 정보를 공유 관리 화면에 전달했습니다. 그 화면에서 연결 결과를 확인해 주세요.');
 }catch{toast('연결 정보를 전달하지 못했습니다. 공유 관리 화면에서 다시 시도해 주세요.')}
 finally{shareSetupState.running=false;managementConnectionGate.lock()}
}
if(new URLSearchParams(String(location.hash||'').replace(/^#/,'' )).has('shareSetup')&&!(typeof shareViewSession!=='undefined'&&shareViewSession.active)){
 const shareSetupRestoreBefore=restoreConnection;
 // A cached manager can finish booting even when its GitHub read fails. The
 // sharing server checks the approved credential independently; retain the
 // original restore result/rejection after the optional handoff settles.
 restoreConnection=async function(...args){try{return await shareSetupRestoreBefore.apply(this,args)}finally{if(!booting)await shareSetupStart()}};
 window.addEventListener('hashchange',()=>{shareSetupState.version++;if(shareSetupState.running)managementConnectionGate.lock()});
}

AppAccess.start(()=>{render();return restoreConnection()});window.addEventListener('production:lock',()=>{managementConnectionGate.lock();const details=document.querySelector('.workspaceConnection');if(details)details.open=false;const token=document.querySelector('#token');if(token)token.value=''});window.addEventListener('online',()=>{if(AppAccess.unlocked)workspace?.flush()});setInterval(()=>{if(AppAccess.unlocked&&workspace?.envelope.queue.length)workspace.flush()},30000);
})();
